<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Launcher</title>
<style>
body{
    margin:0;
    padding:30px;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff
}
h1{margin:0 0 24px}
#status{color:#888;margin-bottom:20px}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px
}
.card{
    display:block;
    padding:20px;
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    transition:.15s
}
.card:hover{
    background:#292929;
    transform:translateY(-2px)
}
.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px
}
.description{
    color:#aaa;
    line-height:1.5;
    white-space:pre-line
}
.path{
    margin-top:14px;
    color:#666;
    font-size:12px;
    word-break:break-all
}
.error{color:#ff7777;white-space:pre-line}
</style>
</head>

<body>
<h1>プログラムを選択</h1>
<div id="status">読み込み中...</div>
<div id="app" class="grid"></div>

<script>
const INDEX_FILE = "./program-index.json";
const CACHE_KEY = "program-launcher-index-v1";

/*
    GitHub Pages の現在URLから
    owner / repository / base path を自動判定
*/
function getGitHubInfo(){
    const host = location.hostname;
    const path = location.pathname.split("/").filter(Boolean);

    /*
        https://USER.github.io/REPO/
    */
    const match = host.match(/^([^./]+)\.github\.io$/i);

    if(!match){
        throw new Error(
            "GitHub PagesのURLを判定できませんでした。\\n" +
            "https://ユーザー名.github.io/リポジトリ/ の形式で開いてください。"
        );
    }

    const owner = match[1];

    /*
        project site:
        /repository/
    */
    if(!path.length){
        /*
            ユーザーサイトの場合。
            現在のURLだけでは「どのrepositoryがPagesの元か」を
            一意に判定できないため、対象外。
        */
        throw new Error(
            "ユーザーサイト形式ではリポジトリをURLだけから判定できません。\\n" +
            "リポジトリ用GitHub Pages（/repository/）で使用してください。"
        );
    }

    const repo = decodeURIComponent(path[0]);
    const basePath = "/" + repo + "/";

    return {owner,repo,basePath};
}

/*
    GitHub API
    → リポジトリ情報
    → default branch を自動取得
*/
async function getRepositoryInfo(owner,repo){
    const url = `https://api.github.com/repos/${owner}/${encodeURIComponent(repo)}`;

    const res = await fetch(url,{
        headers:{
            "Accept":"application/vnd.github+json"
        }
    });

    if(!res.ok){
        const body = await res.text().catch(()=> "");
        throw new Error(
            `GitHubリポジトリ取得失敗: ${res.status} ${res.statusText}` +
            (body ? `\n${body.slice(0,300)}` : "")
        );
    }

    return await res.json();
}

/*
    GitHub Tree
    → リポジトリ内のファイル一覧
*/
async function getTree(owner,repo,branch){
    const url =
        `https://api.github.com/repos/${owner}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`;

    const res = await fetch(url,{
        headers:{
            "Accept":"application/vnd.github+json"
        }
    });

    if(!res.ok){
        const body = await res.text().catch(()=> "");
        throw new Error(
            `GitHubファイル一覧取得失敗: ${res.status} ${res.statusText}` +
            (body ? `\n${body.slice(0,300)}` : "")
        );
    }

    return await res.json();
}

/*
    Raw GitHubからテキスト取得
*/
async function getRaw(owner,repo,branch,path){
    const url =
        `https://raw.githubusercontent.com/${owner}/${repo}/${encodeURIComponent(branch)}/${path
            .split("/")
            .map(encodeURIComponent)
            .join("/")}`;

    const res = await fetch(url);

    if(!res.ok) throw new Error(res.status);

    return await res.text();
}

/*
    HTMLの<title>を取得
*/
async function getTitle(owner,repo,branch,path){
    try{
        const html = await getRaw(owner,repo,branch,path);
        const doc =
            new DOMParser().parseFromString(html,"text/html");

        return (
            doc.querySelector("title")?.textContent?.trim()
        ) || path.split("/").pop().replace(/\.html?$/i,"");
    }catch{
        return path.split("/").pop().replace(/\.html?$/i,"");
    }
}

/*
    READMEの最上部を取得
*/
async function getReadme(owner,repo,branch,path){
    try{
        const text = await getRaw(owner,repo,branch,path);

        return text
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,4)
            .join("\n");
    }catch{
        return "";
    }
}

/*
    HTML一覧からプログラム情報を作る
*/
async function createIndex(owner,repo,branch){
    const tree = await getTree(owner,repo,branch);

    const files = tree.tree.filter(file =>
        file.type === "blob" &&
        /\.html?$/i.test(file.path) &&
        file.path !== "index.html"
    );

    const programs = [];

    /*
        APIを一気に叩きすぎないよう4件ずつ処理
    */
    for(let i=0;i<files.length;i+=4){
        const batch = files.slice(i,i+4);

        const results = await Promise.all(
            batch.map(async file => {
                const parts = file.path.split("/");
                parts.pop();

                const folder = parts.join("/");
                const readme = folder
                    ? `${folder}/README.md`
                    : "README.md";

                const [title,description] = await Promise.all([
                    getTitle(owner,repo,branch,file.path),
                    getReadme(owner,repo,branch,readme)
                ]);

                return {
                    title,
                    description,
                    file:file.path
                };
            })
        );

        programs.push(...results);
    }

    programs.sort((a,b) =>
        a.title.localeCompare(b.title,"ja")
    );

    return programs;
}

/*
    カード表示
*/
function show(programs,basePath){
    const app = document.getElementById("app");

    document.getElementById("status").textContent =
        `${programs.length} 個のプログラム`;

    app.innerHTML = "";

    for(const program of programs){
        const a = document.createElement("a");
        a.className = "card";
        a.href = basePath + program.file;

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = program.title;

        const description = document.createElement("div");
        description.className = "description";
        description.textContent =
            program.description || "説明はありません";

        const path = document.createElement("div");
        path.className = "path";
        path.textContent = program.file;

        a.append(title,description,path);
        app.appendChild(a);
    }
}

/*
    index.json を読み込む
*/
async function loadIndexFile(){
    const res = await fetch(INDEX_FILE,{
        cache:"no-store"
    });

    if(!res.ok) throw new Error(res.status);

    return await res.json();
}

/*
    起動
*/
async function init(){
    const status = document.getElementById("status");

    try{
        const {owner,repo,basePath} = getGitHubInfo();

        /*
            1. まず既存インデックスを確認
        */
        try{
            const programs = await loadIndexFile();
            show(programs,basePath);
            return;
        }catch{
            /*
                indexがなければ生成へ
            */
        }

        /*
            2. 前回生成したローカルキャッシュがあれば先に表示
        */
        try{
            const cache = localStorage.getItem(CACHE_KEY);

            if(cache){
                const data = JSON.parse(cache);

                if(
                    data.owner === owner &&
                    data.repo === repo &&
                    Array.isArray(data.programs)
                ){
                    show(data.programs,basePath);
                }
            }
        }catch{}

        /*
            3. GitHubからリポジトリ情報取得
        */
        status.textContent =
            "インデックスがないためGitHubを確認中...";

        const repository =
            await getRepositoryInfo(owner,repo);

        /*
            default branchを自動使用
        */
        const branch =
            repository.default_branch;

        /*
            4. HTML + READMEからインデックス生成
        */
        status.textContent =
            "プログラムを取得中...";

        const programs =
            await createIndex(owner,repo,branch);

        /*
            5. ブラウザ側にも保存
        */
        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
                owner,
                repo,
                branch,
                programs
            })
        );

        show(programs,basePath);

    }catch(error){
        status.innerHTML =
            `<span class="error">${escapeHtml(error.message)}</span>`;
    }
}

function escapeHtml(text){
    return String(text).replace(
        /[&<>"']/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c])
    );
}

init();
</script>
</body>
</html>
